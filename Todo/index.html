<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Todo List</title>
    <link rel="icon" href="../img/favicon.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="auth-box">
        <p class="login">Đăng nhập</p>
        <form class="auth-form">
            <input
                type="email"
                class="auth-email"
                placeholder="Email..."
                autocomplete="email"
                required
            >
            <input 
                type="password" 
                class="auth-password" 
                placeholder="Mật khẩu" 
                autocomplete="current-password" 
                required 
            >
            <button type="submit">Đăng nhập</button>
            <button type="button" class="btn-signup">Đăng ký</button>
        </form>
        <p class="auth-message"></p>
    </section>
    <div class="to-do-box">
        <p class="header">Todo List</p>
        <form class="form">
            <input type="text" class="title" placeholder=" Nhập tiêu đề...">
            <input type="date" class="deadline">
            <input type="text" class="note" placeholder=" Ghi chú...">
            <button type="submit" class="btn-submit">Thêm</button>
        </form>
        <section class="task-list"></section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
